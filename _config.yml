# boated.zip — custom layout, no external theme.
# The design system lives in _layouts/default.html + assets/css/main.css.

title: "Thodsaporn Chay-intr"
name: "Thodsaporn Chay-intr"
email: t.chayintr@gmail.com
url: "https://boated.zip"
repository: "tchayintr/tchayintr.github.io"

include:
  - _pages
  - _articles
  - assets
exclude:
  - TODO.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.org"
  - "*ltximg*"
  - thodsaporn-chayintr-core-resume.pdf
  - thodsaporn-chayintr-core-resume.docx

markdown: kramdown

defaults:
  - scope:
      path: ""
    values:
      layout: default
